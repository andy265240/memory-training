<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安的记忆培训系统</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:0}
body{padding:20px;background:#f7f9fc;color:#222;transition:.3s;line-height:1.6}.dark{background:#111827;color:#e5e7eb}.wrap{max-width:920px;margin:0 auto}h1{text-align:center;margin-bottom:24px;font-size:28px}
.tab-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;justify-content:center}.tab-group button{padding:9px 14px;border:none;border-radius:10px;cursor:pointer;background:#cbd5e1;color:#111;font-size:15px}.tab-group button.active{background:#3b82f6;color:#fff}
.dark .tab-group button{background:#334155;color:#fff}.dark .tab-group button.active{background:#3b82f6}.panel{display:none;background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:16px}.panel.active{display:block}.dark .panel{background:#1f2937;box-shadow:none}
button{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;background:#3b82f6;color:#fff;font-size:15px;margin:4px 2px}button:hover{opacity:.9}input,select,textarea{padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;margin:4px 2px;outline:none;width:100%;max-width:320px}.dark input,.dark select,.dark textarea{background:#374151;border-color:#4b5563;color:#fff}
.collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;margin-top:10px}.collection-item{border:2px solid #cbd5e1;border-radius:10px;padding:10px;text-align:center;background:#f8fafc}.collection-item.unlock{border-color:#3b82f6;background:#dbeafe}.dark .collection-item{background:#334155;border-color:#475569}.dark .collection-item.unlock{background:#1e3a5a;border-color:#3b82f6}#confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}.poem-blank{width:120px;display:inline-block;border-bottom:2px solid #3b82f6;margin:0 4px;color:#3b82f6;font-weight:bold}.cube-wall{display:grid;gap:3px;margin:10px auto;max-width:600px}.cube{aspect-ratio:1;border-radius:4px;cursor:pointer}.cube-mask{background:#9ca3af!important}.word-answer-area{margin-top:24px;padding-top:20px;border-top:1px solid #e2e8f0}
</style>
</head>
<body>
<div id="confetti-container"></div><div class="wrap"><h1>安的记忆培训系统</h1>
<div class="tab-group"><button onclick="toggleDark()">🌓深色模式</button><button onclick="openTab('trainTab')">训练中心</button><button onclick="openTab('recordTab')">📊成绩档案</button><button onclick="openTab('levelTab')">🎮闯关徽章&藏品图鉴</button><button onclick="openTab('dailyTab')">📅每日打卡任务</button><button onclick="openTab('warmTab')">🧠热身小游戏</button><button onclick="openTab('poemTab')">📜古诗背诵</button><button onclick="openTab('wordTab')">📖单词记忆&错题本</button><button onclick="openTab('champTab')">🏆锦标赛专项</button><button onclick="openTab('palaceTab')">🏠记忆宫殿地点桩</button><button onclick="openTab('pkTab')">⚔双人PK对战</button></div>
<div id="trainTab" class="panel active"><h3>通用记忆训练</h3><div>数量：<input type="number" id="trainCount" value="20"></div><div>训练模式：<select id="trainMode"><option value="race">🏁比赛模式（倒计时）</option><option value="practice">🌱练习模式（无计时）</option></select></div><div>计时：<span id="timerText">00:00</span><button onclick="startTimer()">开始计时</button><button onclick="pauseTimer()">暂停</button><button onclick="stopTimer()">结束</button></div><div id="trainArea"></div><button onclick="startTrain()">开始训练</button><button onclick="checkAnswer()">提交判分</button><div id="trainResult"></div></div>
<div id="recordTab" class="panel"><h3>📊训练成绩档案</h3><button onclick="renderRecordPanel()">刷新记录</button><button onclick="clearRecords()">清空全部记录</button><div id="recordBox"></div></div>
<div id="levelTab" class="panel"><h3>🎮闯关进度 & 藏品收集图鉴</h3><button onclick="renderLevelPanel()">刷新闯关信息</button><div id="levelBox"></div><h4>藏品图鉴</h4><div id="collectionBox" class="collection-grid"></div><p>完成项目达标，自动解锁藏品卡片</p></div>
<div id="dailyTab" class="panel"><h3>📅每日打卡任务</h3><button onclick="renderDailyTask()">刷新任务</button><div id="dailyBox"></div></div>
<div id="warmTab" class="panel"><h3>🧠大脑热身小游戏｜魔方墙记忆闯关</h3><p>当前魔方墙关卡：<span id="cubeLevelText">3×3</span></p><button onclick="initCubeGame()">开始本关魔方墙</button><button onclick="resetCubeProgress()">重置魔方墙闯关进度</button><div id="warmBox"></div></div>
<div id="poemTab" class="panel"><h3>📜古诗背诵｜遮挡/挖空填空训练</h3><button onclick="poemBlankMode('char')">字词挖空模式</button><button onclick="poemBlankMode('sentence')">整句挖空模式</button><button onclick="exitPoemBlank()">退出填空模式，回到普通隐藏</button><div id="poemBox"><p><span id="p1">床前明月光</span> <button onclick="toggleHide('p1')">隐藏/显示</button></p><p><span id="p2">疑是地上霜</span> <button onclick="toggleHide('p2')">隐藏/显示</button></p><p><span id="p3">举头望明月</span> <button onclick="toggleHide('p3')">隐藏/显示</button></p><p><span id="p4">低头思故乡</span> <button onclick="toggleHide('p4')">隐藏/显示</button></p></div><textarea id="poemInput" placeholder="粘贴你自己的古诗，用换行分隔"></textarea><button onclick="loadCustomPoem()">加载自定义古诗</button><div id="poemBlankResult"></div></div>
<div id="wordTab" class="panel"><h3>📖小学单词记忆训练 + 错题卡片净化</h3><p>选择年级：<select id="gradeSel"><option value="g1">一年级</option><option value="g2">二年级</option><option value="g3">三年级</option><option value="g4">四年级</option><option value="g5">五年级</option><option value="g6">六年级</option></select></p><p>抽取单词数量：<input type="number" id="wordTotalNum" value="8"></p><button onclick="startWordMemoPhase()">【第一步】开始记忆浏览</button><button onclick="renderWrongList()">查看错题卡片</button><button onclick="reviewWrongWords()">复习错题净化</button><button onclick="clearWrong()">清空错题</button><div id="wordMemoBox"></div><div id="wordAnswerBox" class="word-answer-area" style="display:none"><h4>答题区</h4><div id="wordShow" style="font-size:26px;font-weight:bold"></div><input id="wordAns" placeholder="在这里输入英文答案"><button onclick="checkWord()">提交答案</button><div id="wordTip"></div></div><div id="wrongBox"></div></div>
<div id="champTab" class="panel"><h3>🏆记忆锦标赛10大项目</h3><div><button onclick="champSelect('words')">随机词语（连锁扣分）</button><button onclick="champSelect('graph')">抽象图形训练(15min)</button><button onclick="champSelect('fastNum')">快速数字</button><button onclick="champSelect('binary')">二进制数字</button><button onclick="champSelect('nameAvatar')">人名头像</button><button onclick="champSelect('date')">历史日期</button><button onclick="champSelect('oneHourNum')">一小时数字</button><button onclick="champSelect('oneHourCard')">一小时扑克牌</button><button onclick="champSelect('listenNum')">听记数字</button><button onclick="champSelect('fastCard')">快速扑克</button></div><div id="champBox"></div></div>
<div id="palaceTab" class="panel"><h3>🏠记忆宫殿地点桩素材库</h3><select id="palaceSel" onchange="loadPalace()"><option value="home">家里地点桩</option><option value="class">教室地点桩</option><option value="street">街道地点桩</option></select><div id="palaceList"></div></div>
<div id="pkTab" class="panel"><h3>⚔双人PK对战（可合作/对战）</h3><select id="pkMode"><option value="battle">对战模式</option><option value="coop">合作闯关</option></select><button onclick="savePlayerA()">保存选手A成绩</button><button onclick="savePlayerB()">保存选手B成绩</button><button onclick="showPKResult()">查看PK结果</button><div id="pkResult"></div></div></div>
<script>
/* 安的记忆培训系统 V2.0 - 学生档案已取消 */
const $=id=>document.getElementById(id);
function createConfetti(){const c=$('confetti-container');for(let i=0;i<60;i++){const d=document.createElement('div');d.style.cssText='position:absolute;width:10px;height:10px;left:'+Math.random()*100+'%;top:-10px;background:'+['#3b82f6','#16a34a','#f59e0b','#ec4899'][Math.floor(Math.random()*4)]+';border-radius:'+(Math.random()>.5?'50%':'0')+';opacity:.8';c.appendChild(d);const t=setInterval(()=>{let y=parseFloat(d.style.top);y+=2+Math.random()*3;d.style.top=y+'px';if(y>innerHeight){clearInterval(t);d.remove()}},25)}}
function speakText(text,lang='zh-CN'){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=1;speechSynthesis.cancel();speechSynthesis.speak(u)}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('darkMode',document.body.classList.contains('dark')?'1':'0')}
function openTab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');if(id==='recordTab')renderRecordPanel();if(id==='levelTab')renderLevelPanel();if(id==='dailyTab')renderDailyTask();if(id==='palaceTab')loadPalace()}
const cubeWallVoice=['太棒啦！3×3魔方墙一次拿下！','很不错！4阶魔方墙通关！','做得很好！5阶通关！','厉害！6阶挑战成功！','完美！7阶通关！','优秀！8阶顺利完成！','很好！9阶魔方墙通关！','恭喜通关10阶！','11阶挑战成功！','12阶完成！','13阶通关！','14阶拿下！','15阶闯关成功！','16阶顺利通关！','17阶挑战成功！','18阶通关！','19阶拿下！','恭喜通关20阶！','21阶挑战成功！','22阶通关！','23阶完成！','24阶闯关成功！','恭喜拿下25阶！','26阶通关！','27阶挑战成功！','28阶通关！','29阶拿下！','恭喜通关30阶！','31阶挑战成功！','32阶通关！','33阶魔方墙拿下！','34阶通关！','恭喜通关35阶！','36阶挑战成功！','37阶通关！','38阶拿下！','39阶通关！','恭喜通关40阶！','41阶挑战成功！','42阶通关！','43阶拿下！','44阶通关！','45阶闯关成功！','46阶通关！','47阶挑战成功！','48阶拿下！','49阶通关！','恭喜你通关50×50魔方墙！'];
const cubeColors=['#ef4444','#22c55e','#3b82f6','#facc15','#a855f7','#f97316'];let cubeCurrentLevel=parseInt(localStorage.getItem('cubeWallLevel'))||0,cubeOriginData=[],cubeUserData=[];
function refreshCubeLevelText(){const n=Math.min(50,3+cubeCurrentLevel);$('cubeLevelText').innerText=n+'×'+n}function resetCubeProgress(){cubeCurrentLevel=0;localStorage.setItem('cubeWallLevel',0);refreshCubeLevelText();alert('魔方墙闯关进度已重置，回到3×3')}
function initCubeGame(){const size=Math.min(50,3+cubeCurrentLevel);cubeOriginData=[];cubeUserData=[];const box=$('warmBox');box.innerHTML='<p>【记忆阶段】记住颜色与位置。完成后点击【隐藏魔方墙，开始作答】</p><button onclick="cubeStartAnswer()">隐藏魔方墙，开始作答</button><div class="cube-wall" id="cubeWallDom" style="grid-template-columns:repeat('+size+',1fr)"></div>';const wall=$('cubeWallDom');for(let y=0;y<size;y++){cubeOriginData[y]=[];cubeUserData[y]=[];for(let x=0;x<size;x++){const col=cubeColors[Math.floor(Math.random()*cubeColors.length)];cubeOriginData[y][x]=col;cubeUserData[y][x]='#9ca3af';const d=document.createElement('div');d.className='cube';d.style.background=col;wall.appendChild(d)}}}
function cubeStartAnswer(){const size=Math.min(50,3+cubeCurrentLevel),wall=$('cubeWallDom');wall.innerHTML='';for(let y=0;y<size;y++)for(let x=0;x<size;x++){const d=document.createElement('div');d.className='cube cube-mask';d.dataset.x=x;d.dataset.y=y;d.style.background=cubeUserData[y][x];d.onclick=()=>cubeClickCell(x,y,d);wall.appendChild(d)}$('warmBox').insertAdjacentHTML('beforeend','<br><button onclick="cubeCheckAll()">提交全部答案，判分通关</button>')}
function cubeClickCell(x,y,d){const i=cubeColors.indexOf(cubeUserData[y][x]);const n=(i+1)%cubeColors.length;cubeUserData[y][x]=cubeColors[n];d.style.background=cubeColors[n]}
function cubeCheckAll(){const size=Math.min(50,3+cubeCurrentLevel);let correct=0,total=size*size;for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(cubeOriginData[y][x]===cubeUserData[y][x])correct++;const rate=correct/total;saveRecord('魔方墙',total,correct,0,rate);if(rate===1){createConfetti();speakText(cubeWallVoice[Math.min(cubeCurrentLevel,cubeWallVoice.length-1)]+' '+praiseVoice.high[Math.floor(Math.random()*praiseVoice.high.length)]);alert('🎉恭喜通关'+size+'×'+size+'魔方墙！');if(size<50)cubeCurrentLevel++;localStorage.setItem('cubeWallLevel',cubeCurrentLevel);refreshCubeLevelText()}else alert('本关正确率：'+(rate*100).toFixed(1)+'%，需要100%才能通关。继续调整！')}
let timerId=null,timerSec=0,timerRunning=false;
function updateTimer(){ $('timerText').innerText=String(Math.floor(timerSec/60)).padStart(2,'0')+':'+String(timerSec%60).padStart(2,'0') }
function startTimer(){if(timerRunning)return;if(timerSec===0)timerSec=0;timerRunning=true;timerId=setInterval(()=>{timerSec++;updateTimer()},1000)}
function pauseTimer(){clearInterval(timerId);timerId=null;timerRunning=false}
function stopTimer(){clearInterval(timerId);timerId=null;timerRunning=false;timerSec=0;updateTimer()}
const trainBank={数字:['381726','904152','617308','295641','473820','856193','720465','138974','562301','947286','315809','684127'],词语:['苹果','火车','太阳','森林','钥匙','飞机','书包','河流','灯塔','花园','城堡','月亮']};
let trainItems=[],trainAnswer=[];
function startTrain(){const count=Math.max(1,Math.min(500,parseInt($('trainCount').value)||20));const mode=$('trainMode').value;const isNum=Math.random()>.5;trainItems=[];trainAnswer=[];for(let i=0;i<count;i++)trainItems.push(trainBank[isNum?'数字':'词语'][Math.floor(Math.random()*trainBank[isNum?'数字':'词语'].length)]);$('trainArea').innerHTML='<div id="memoryDisplay" style="font-size:24px;line-height:2;word-break:break-all">'+trainItems.map((x,i)=>'<span>'+x+(i<count-1?'　':'')+'</span>').join('')+'</div><p>记忆完成后点击【隐藏并作答】</p><button onclick="hideTrainMemory()">隐藏并作答</button>';stopTimer();if(mode==='race')startTimer()}
function hideTrainMemory(){$('memoryDisplay').style.display='none';$('trainArea').insertAdjacentHTML('beforeend','<p>请输入记忆内容（按原顺序，用空格或逗号分隔）：</p><textarea id="trainAnswerInput" style="max-width:100%;height:120px"></textarea>');}
function checkAnswer(){if(!trainItems.length){alert('请先开始训练');return}const raw=($('trainAnswerInput')?.value||'').trim();if(!raw){alert('请先输入答案');return}const arr=raw.split(/[\s,，、;；]+/).filter(Boolean);let correct=0;for(let i=0;i<Math.min(arr.length,trainItems.length);i++)if(arr[i]===trainItems[i])correct++;const rate=correct/trainItems.length;const elapsed=timerSec;pauseTimer();saveRecord('通用记忆',trainItems.length,correct,elapsed,rate);$('trainResult').innerHTML='<div style="padding:14px;margin-top:12px;border-radius:10px;background:'+(rate>=.6?'#dcfce7':'#fee2e2')+'"><b>训练完成</b><br>正确：'+correct+' / '+trainItems.length+'<br>正确率：'+(rate*100).toFixed(1)+'%<br>用时：'+formatSec(elapsed)+'</div>';if(rate>=.8)createConfetti();praiseChild(rate>=.8?'high':rate>=.6?'mid':'low');if(rate>=.8)createConfetti()}

const praiseVoice={high:['太棒了！你做得真厉害！','哇！答得太好了！继续保持！','太优秀啦！你的记忆力真棒！','真厉害！老师为你点赞！','太棒啦！你越来越厉害了！'],mid:['做得不错！继续加油！','很好！再努力一点就更棒啦！','不错哦！你已经进步了！','很棒！下一次挑战更高分！'],low:['没关系，再试一次！你一定可以的！','不要灰心！动动脑筋，再来一次！','加油！错误也是进步的一部分！','相信自己，你可以做得更好！']};
function praiseChild(level){const a=praiseVoice[level]||praiseVoice.mid;const text=a[Math.floor(Math.random()*a.length)];speakText(text)}

function formatSec(s){return Math.floor(s/60)+'分'+(s%60)+'秒'}
function getRecords(){try{return JSON.parse(localStorage.getItem('memoryRecords')||'[]')}catch(e){return[]}}
function saveRecord(project,total,correct,seconds,rate){const r=getRecords();r.push({date:new Date().toLocaleString('zh-CN'),project,total,correct,seconds,rate});localStorage.setItem('memoryRecords',JSON.stringify(r.slice(-300)));}
function renderRecordPanel(){const r=getRecords().slice().reverse();if(!r.length){$('recordBox').innerHTML='<p>暂无训练记录。</p>';return}const best={};r.forEach(x=>{if(!best[x.project]||x.rate>best[x.project].rate)best[x.project]=x});let h='<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th>时间</th><th>项目</th><th>数量</th><th>正确</th><th>正确率</th><th>用时</th></tr>';r.slice(0,30).forEach(x=>{h+='<tr><td>'+x.date+'</td><td>'+x.project+'</td><td>'+x.total+'</td><td>'+x.correct+'</td><td>'+((x.rate||0)*100).toFixed(1)+'%</td><td>'+formatSec(x.seconds||0)+'</td></tr>'});h+='</table></div><hr><h4>各项目历史最佳</h4>';Object.keys(best).forEach(k=>h+='<p>🏆 '+k+'：'+(best[k].rate*100).toFixed(1)+'%</p>');$('recordBox').innerHTML=h}
function clearRecords(){if(confirm('确定清空全部成绩记录吗？')){localStorage.removeItem('memoryRecords');renderRecordPanel()}}
const badges=['初学者','连续训练','60%达标','80%优秀','90%精英','魔方3阶','魔方10阶','魔方20阶','魔方30阶','魔方40阶','魔方50阶'];
function renderLevelPanel(){const r=getRecords();const total=r.length,avg=total?r.reduce((a,x)=>a+x.rate,0)/total:0;const cube=3+cubeCurrentLevel;let unlocked=0;if(total>=1)unlocked++;if(total>=7)unlocked++;if(avg>=.6)unlocked++;if(avg>=.8)unlocked++;if(avg>=.9)unlocked++;for(let n of [3,10,20,30,40,50])if(cube>=n)unlocked++;$('levelBox').innerHTML='<p>累计训练：<b>'+total+'</b> 次</p><p>综合平均正确率：<b>'+((avg||0)*100).toFixed(1)+'%</b></p><p>魔方墙最高：<b>'+Math.min(50,cube)+'×'+Math.min(50,cube)+'</b></p><p>已解锁徽章：<b>'+unlocked+'/'+badges.length+'</b></p>';let h='';badges.forEach((b,i)=>h+='<div class="collection-item '+(i<unlocked?'unlock':'')+'">'+(i<unlocked?'🏅':'🔒')+'<br>'+b+'</div>');$('collectionBox').innerHTML=h}
function renderDailyTask(){const key='dailyMemoryTask';let d=localStorage.getItem(key);const today=new Date().toLocaleDateString('zh-CN');if(!d)d=today+'|0';let [date,count]=d.split('|');if(date!==today){date=today;count='0'}const done=getRecords().filter(x=>x.date.startsWith(today)).length;localStorage.setItem(key,today+'|'+done);$('dailyBox').innerHTML='<p>今日任务：完成 <b>3 次</b>记忆训练</p><p>今日已完成：<b>'+Math.min(3,done)+'/3</b></p><div style="font-size:28px">'+(done>=3?'🎉 今日任务完成！':'🔥 继续加油！')+'</div>'}
function toggleHide(id){const e=$(id);e.style.visibility=e.style.visibility==='hidden'?'visible':'hidden'}
let poemLines=['床前明月光','疑是地上霜','举头望明月','低头思故乡'];let poemMode='none';
function renderPoem(){let h='';poemLines.forEach((line,i)=>{let shown=line;if(poemMode==='sentence')shown='<span class="poem-blank">'+line+'</span>';if(poemMode==='char')shown=line.split('').map((c,j)=>j%2?'_':c).join('');h+='<p>'+shown+' <button onclick="toggleHide(\'p'+i+'\')">隐藏/显示</button></p>'});$('poemBox').innerHTML=h}
function poemBlankMode(mode){poemMode=mode;renderPoem();$('poemBlankResult').innerHTML='<p>填空模式已开启：'+(mode==='char'?'字词挖空':'整句挖空')+'。</p>'}
function exitPoemBlank(){poemMode='none';$('poemBox').innerHTML=poemLines.map((x,i)=>'<p><span id="p'+i+'">'+x+'</span> <button onclick="toggleHide(\'p'+i+'\')">隐藏/显示</button></p>').join('');$('poemBlankResult').innerHTML=''}
function loadCustomPoem(){const v=$('poemInput').value.trim();if(!v){alert('请先粘贴古诗，每行一句');return}poemLines=v.split(/\n+/).map(x=>x.trim()).filter(Boolean);poemMode='none';exitPoemBlank();alert('自定义古诗已加载，共'+poemLines.length+'句')}
const wordSets={g1:[['cat','猫'],['dog','狗'],['book','书'],['pen','钢笔'],['sun','太阳'],['red','红色'],['one','一'],['apple','苹果']],g2:[['school','学校'],['teacher','老师'],['friend','朋友'],['water','水'],['happy','开心'],['family','家庭'],['house','房子'],['bird','鸟']],g3:[['morning','早上'],['afternoon','下午'],['market','市场'],['travel','旅行'],['beautiful','漂亮'],['question','问题'],['answer','答案'],['window','窗户']],g4:[['hospital','医院'],['station','车站'],['weather','天气'],['holiday','假期'],['important','重要的'],['together','一起'],['remember','记住'],['different','不同的']],g5:[['adventure','冒险'],['environment','环境'],['information','信息'],['experience','经历'],['comfortable','舒服的'],['possible','可能的'],['favorite','最喜欢的'],['conversation','对话']],g6:[['international','国际的'],['opportunity','机会'],['relationship','关系'],['communication','交流'],['responsibility','责任'],['successful','成功的'],['education','教育'],['interesting','有趣的']]};let wordQueue=[],wordIndex=0,wordCorrect=0;
function getWrong(){try{return JSON.parse(localStorage.getItem('wrongWords')||'[]')}catch(e){return[]}}
function startWordMemoPhase(){const set=wordSets[$('gradeSel').value]||wordSets.g1;let n=Math.max(1,Math.min(set.length,parseInt($('wordTotalNum').value)||8));wordQueue=[...set].sort(()=>Math.random()-.5).slice(0,n);wordIndex=0;wordCorrect=0;$('wordAnswerBox').style.display='none';$('wordMemoBox').innerHTML='<p>记忆阶段：共 '+n+' 个单词</p>'+wordQueue.map((w,i)=>'<p><b>'+w[0]+'</b> /'+w[1]+'/ <button onclick="speakText(\''+w[0]+'\',\'en-US\')">🔊</button></p>').join('')+'<button onclick="startWordTest()">开始答题</button>'}
function startWordTest(){wordIndex=0;$('wordAnswerBox').style.display='block';showCurrentWord()}
function showCurrentWord(){if(wordIndex>=wordQueue.length){const rate=wordCorrect/wordQueue.length;saveRecord('小学单词',wordQueue.length,wordCorrect,0,rate);$('wordShow').innerHTML='训练完成';$('wordTip').innerHTML='正确率：'+(rate*100).toFixed(1)+'%';return}$('wordShow').innerText=wordQueue[wordIndex][1];$('wordAns').value='';$('wordTip').innerText='第 '+(wordIndex+1)+' / '+wordQueue.length+' 题'}
function checkWord(){const ans=$('wordAns').value.trim().toLowerCase();const target=wordQueue[wordIndex][0].toLowerCase();if(ans===target){wordCorrect++;$('wordTip').innerText='✅ 正确！';praiseChild('high');}else{let w=getWrong();w.push({word:target,meaning:wordQueue[wordIndex][1],time:new Date().toLocaleString('zh-CN')});localStorage.setItem('wrongWords',JSON.stringify(w.slice(-200)));$('wordTip').innerText='❌ 正确答案：'+target;praiseChild('low')}wordIndex++;setTimeout(showCurrentWord,500)}
function renderWrongList(){const w=getWrong();$('wrongBox').innerHTML='<h4>错题卡片（'+w.length+'）</h4>'+(w.length?w.slice().reverse().map(x=>'<div style="padding:8px;border-bottom:1px solid #ddd"><b>'+x.word+'</b> — '+x.meaning+'</div>').join(''):'<p>暂无错题。</p>')}
function reviewWrongWords(){const w=getWrong();if(!w.length){alert('暂无错题');return}wordQueue=w.slice(-10).map(x=>[x.word,x.meaning]);wordIndex=0;wordCorrect=0;$('wordAnswerBox').style.display='block';showCurrentWord()}
function clearWrong(){if(confirm('确定清空错题本吗？')){localStorage.removeItem('wrongWords');renderWrongList()}}

let champItems=[];
function champSelect(type){const names={words:'随机词语',graph:'抽象图形',fastNum:'快速数字',binary:'二进制数字',nameAvatar:'人名头像',date:'历史日期',oneHourNum:'一小时数字',oneHourCard:'一小时扑克牌',listenNum:'听记数字',fastCard:'快速扑克'};champItems=[...(champData[type]||champData.fastNum)].sort(()=>Math.random()-.5);$('champBox').innerHTML='<h4>'+names[type]+'专项训练</h4><p>记忆材料：</p><div id="champMemory" style="font-size:24px;line-height:2">'+champItems.join('　')+'</div><button onclick="champHide()">隐藏材料并作答</button><div id="champAnswer"></div>'}
function champHide(){$('champMemory').style.display='none';$('champAnswer').innerHTML='<textarea id="champInput" style="max-width:100%;height:120px" placeholder="按原顺序输入，用空格/逗号分隔"></textarea><br><button onclick="champCheck()">提交判分</button>'}
function champCheck(){const a=($('champInput').value||'').trim().split(/[\s,，、;；]+/).filter(Boolean);let c=0;for(let i=0;i<Math.min(a.length,champItems.length);i++)if(a[i]===champItems[i])c++;const rate=c/champItems.length;saveRecord('锦标赛专项',champItems.length,c,0,rate);$('champAnswer').innerHTML='<p>正确：'+c+'/'+champItems.length+'，正确率：'+(rate*100).toFixed(1)+'%</p>';if(rate>=.8)createConfetti()}
